<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #f7f4ef; --surface: #ffffff; --border: #e6e0d4; --text: #30291f;
    --muted: #8a8171; --accent: #c15f3c; --accent-soft: #f3e3da; --success: #5c7a52;
  }
  * { box-sizing: border-box; }
  body {
    width: 320px; margin: 0; background: var(--bg); color: var(--text);
    font-family: "Segoe UI", system-ui, sans-serif; font-size: 13px;
  }
  header {
    display: flex; align-items: center; gap: 8px; padding: 12px 14px;
    border-bottom: 1px solid var(--border);
  }
  header .lock { font-size: 15px; }
  header .title { font-weight: 600; }
  #search {
    width: 100%; border: 1px solid var(--border); border-radius: 6px;
    background: var(--surface); color: var(--text); padding: 7px 9px;
    font-size: 13px; outline: none;
  }
  #search:focus { border-color: var(--accent); }
  #search-wrap { padding: 10px 14px 6px; }
  #list { max-height: 320px; overflow-y: auto; padding: 4px 6px 10px; }
  .row {
    display: flex; flex-direction: column; gap: 2px; padding: 8px 8px;
    border-radius: 6px; cursor: pointer;
  }
  .row:hover { background: var(--accent-soft); }
  .row .t { font-weight: 600; }
  .row .u { color: var(--muted); font-size: 12px; }
  #status { padding: 10px 14px; color: var(--muted); font-size: 12px; }
  #status.error { color: #b3493a; }
  #status.ok { color: var(--success); }
  a { color: var(--accent); }
</style>
</head>
<body>
  <header><span class="lock">&#128274;</span><span class="title">Vault Quick Copy</span></header>
  <div id="search-wrap"><input id="search" type="text" placeholder="Search entries..."></div>
  <div id="list"></div>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
