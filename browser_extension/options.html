<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body {
    font-family: "Segoe UI", system-ui, sans-serif; background: #f7f4ef; color: #30291f;
    max-width: 440px; margin: 30px auto; padding: 0 16px;
  }
  h2 { font-size: 17px; }
  p { color: #8a8171; font-size: 13px; line-height: 1.5; }
  input {
    width: 100%; padding: 9px 10px; border: 1px solid #e6e0d4; border-radius: 6px;
    font-size: 13px; margin: 6px 0 12px; box-sizing: border-box;
  }
  button {
    background: #c15f3c; color: #fff; border: none; border-radius: 6px;
    padding: 9px 16px; font-weight: 600; cursor: pointer;
  }
  #status { margin-top: 10px; font-size: 13px; }
</style>
</head>
<body>
  <h2>Vault Quick Copy - setup</h2>
  <p>
    Open the Vault desktop app, click <strong>"Browser extension..."</strong> in the top bar,
    and copy the pairing token shown there. Paste it below.
  </p>
  <label for="token">Pairing token</label>
  <input id="token" type="text" placeholder="paste token here">
  <button id="save">Save</button>
  <div id="status"></div>
  <script src="options.js"></script>
</body>
</html>
